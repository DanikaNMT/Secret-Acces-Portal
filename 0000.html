<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobbelsteen Teller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
            text-align: center;
        }

        .dice-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .dice-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 3em;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .dice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .dice-btn:active {
            transform: translateY(-2px);
            animation: flash 0.3s;
        }

        @keyframes flash {
            0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            50% { background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); }
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: transform 0.2s;
            display: block;
            margin: 30px auto;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            background: #c0392b;
        }

        .stats {
            margin: 40px 0;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin: 15px 0;
            gap: 15px;
        }

        .stat-label {
            font-size: 2em;
            font-weight: bold;
            width: 60px;
            text-align: center;
            color: #667eea;
        }

        .stat-bar-container {
            flex: 1;
            background: #e0e0e0;
            border-radius: 10px;
            height: 40px;
            position: relative;
            overflow: hidden;
        }

        .stat-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            min-width: 50px;
        }

        .stat-count {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            min-width: 50px;
            text-align: right;
        }

        .total-rolls {
            text-align: center;
            font-size: 1.3em;
            color: #666;
            margin: 30px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .back-btn {
            margin-top: 30px;
            background: #666;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #555;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .dice-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .dice-btn {
                padding: 20px;
                font-size: 2.5em;
            }

            .stat-label {
                font-size: 1.5em;
                width: 40px;
            }

            .stat-bar {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Dobbelsteen Teller</h1>
        <p class="subtitle">Gooi je dobbelsteen en klik op het nummer dat je gooit!</p>

        <div class="dice-buttons">
            <button class="dice-btn" onclick="recordRoll(1)">⚀</button>
            <button class="dice-btn" onclick="recordRoll(2)">⚁</button>
            <button class="dice-btn" onclick="recordRoll(3)">⚂</button>
            <button class="dice-btn" onclick="recordRoll(4)">⚃</button>
            <button class="dice-btn" onclick="recordRoll(5)">⚄</button>
            <button class="dice-btn" onclick="recordRoll(6)">⚅</button>
        </div>

        <button class="reset-btn" onclick="resetStats()">🔄 Reset Alles</button>

        <div class="total-rolls">
            <strong>Totaal gegooid:</strong> <span id="totalRolls">0</span> keer
        </div>

        <div class="stats" id="stats">
            <div class="stat-row">
                <div class="stat-label">⚀</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar1" style="width: 0%">
                        <span id="count1">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label1">0</span>x</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">⚁</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar2" style="width: 0%">
                        <span id="count2">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label2">0</span>x</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">⚂</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar3" style="width: 0%">
                        <span id="count3">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label3">0</span>x</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">⚃</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar4" style="width: 0%">
                        <span id="count4">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label4">0</span>x</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">⚄</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar5" style="width: 0%">
                        <span id="count5">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label5">0</span>x</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">⚅</div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="bar6" style="width: 0%">
                        <span id="count6">0</span>
                    </div>
                </div>
                <div class="stat-count"><span id="label6">0</span>x</div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">Terug naar Start</a>
        </div>
    </div>

    <script>
        let counts = [0, 0, 0, 0, 0, 0];
        let totalRolls = 0;

        function recordRoll(number) {
            // Update count
            counts[number - 1]++;
            totalRolls++;
            
            // Update stats
            updateStats();
        }

        function updateStats() {
            // Find max count for scaling bars
            const maxCount = Math.max(...counts, 1);
            
            // Update total
            document.getElementById('totalRolls').textContent = totalRolls;
            
            // Update each bar
            for (let i = 0; i < 6; i++) {
                const count = counts[i];
                const percentage = (count / maxCount) * 100;
                
                document.getElementById(`bar${i + 1}`).style.width = percentage + '%';
                document.getElementById(`count${i + 1}`).textContent = count;
                document.getElementById(`label${i + 1}`).textContent = count;
            }
        }

        function resetStats() {
            counts = [0, 0, 0, 0, 0, 0];
            totalRolls = 0;
            updateStats();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verborgen Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1em;
        }

        .white-box {
            background: white;
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 80px;
            margin: 30px 0;
            min-height: 300px;
            position: relative;
            cursor: text;
            user-select: text;
        }

        .hidden-text {
            color: white;
            font-size: 2em;
            font-weight: bold;
            position: absolute;
            top: 45%;
            left: 35%;
            user-select: text;
        }

        .back-btn {
            margin-top: 30px;
            background: #666;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #555;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.6em;
            }

            .white-box {
                padding: 60px 40px;
                min-height: 250px;
            }

            .hidden-text {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="white-box">
            <span class="hidden-text">D1</span>
        </div>

        <a href="index.html" class="back-btn">Terug naar Start</a>
    </div>
</body>
</html>

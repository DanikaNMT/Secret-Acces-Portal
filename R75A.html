<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Location</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .rebus-container {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px dashed #667eea;
        }

        .rebus-item {
            display: inline-block;
            margin: 10px;
            vertical-align: middle;
        }

        .rebus-image {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .rebus-text {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 0 10px;
        }

        .hint {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            color: #856404;
        }

        .hint-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .back-btn {
            margin-top: 20px;
            background: #666;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #555;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .rebus-image {
                max-width: 150px;
            }

            .rebus-text {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rebus-container">
            <div class="rebus-item">
                <img src="https://www.uantwerpen.be/thumb/6b35887d016699f021e0d5cadf9a0a68/assets/img/images/743804/w1600-h697-cc/118150c4-8b00-4e96-9116-0c52ea9085b2.jpg" 
                     alt="Rebus image" 
                     class="rebus-image"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/200x150?text=Image+Not+Available';">
            </div>
            <div class="rebus-item">
                <span class="rebus-text">- 43</span>
            </div>
        </div>
        <a href="index.html" class="back-btn">Back to Entry</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadeau Tijd!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: bounceIn 0.8s;
            position: relative;
            z-index: 10;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .emoji-big {
            font-size: 5em;
            margin-bottom: 20px;
            animation: rotate 2s ease-in-out infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        h1 {
            color: #f5576c;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .message {
            font-size: 1.3em;
            color: #555;
            line-height: 1.8;
            margin: 30px 0;
            font-weight: 500;
        }

        .highlight {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .gift-box {
            font-size: 8em;
            margin: 30px 0;
            cursor: pointer;
            transition: transform 0.3s;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .gift-box:hover {
            transform: scale(1.2) rotate(5deg);
        }

        .celebration {
            font-size: 2em;
            margin: 20px 0;
        }

        .instruction-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .instruction-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .instruction-text {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .location-code {
            background: rgba(255, 255, 255, 0.2);
            border: 3px dashed white;
            padding: 15px 25px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
        }

        .back-btn {
            margin-top: 30px;
            background: #f5576c;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2em;
            }

            .emoji-big {
                font-size: 4em;
            }

            .message {
                font-size: 1.1em;
            }

            .gift-box {
                font-size: 6em;
            }

            .location-code {
                font-size: 1.5em;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-big">🎉</div>
        
        <h1>Goed Bezig!</h1>
        
        <div class="celebration">🎊 ✨ 🎈 🎁 🎊</div>
        
        <div class="message">
            Als beloning mag je nu cadeau 1 openen! 🎁
        </div>

        <div class="instruction-box">
            <div class="instruction-title">📍 Volgende Stap</div>
            <div class="instruction-text">
                Zoek deze locatie op en zet daar je kaars:
            </div>
            <div class="location-code">B1</div>
            <div class="instruction-text">
                Veel plezier met je cadeau! 🎉
            </div>
        </div>

        <a href="index.html" class="back-btn">Terug naar Start</a>
    </div>

    <script>
        // Create confetti
        function createConfetti() {
            const colors = ['#ffd700', '#ff69b4', '#00bfff', '#ff6347', '#7fff00', '#ff1493'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Start confetti on page load
        window.onload = createConfetti;

        // Gift box click effect
        document.querySelector('.gift-box').addEventListener('click', function() {
            this.style.animation = 'none';
            setTimeout(() => {
                this.style.animation = 'pulse 2s ease-in-out infinite';
            }, 10);
            createConfetti();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braille Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1em;
        }

        .braille-container {
            background: #f8f9fa;
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 50px;
            margin: 30px 0;
            display: inline-block;
        }

        .braille-text {
            font-size: 8em;
            font-family: 'Arial', sans-serif;
            color: #333;
            letter-spacing: 20px;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .hint {
            background: #e7f3ff;
            border: 2px solid #2196F3;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
            color: #0d47a1;
        }

        .hint-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .hint-text {
            font-size: 0.95em;
            line-height: 1.6;
        }

        .back-btn {
            margin-top: 30px;
            background: #667eea;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .braille-container {
                padding: 30px 20px;
            }

            .braille-text {
                font-size: 5em;
                letter-spacing: 10px;
            }
        }

        @media (max-width: 480px) {
            .braille-text {
                font-size: 3.5em;
                letter-spacing: 8px;
            }

            .braille-container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="braille-container">
            <div class="braille-text">⠃⠼</div>
        </div>

        <a href="index.html" class="back-btn">Back to Entry</a>
    </div>
</body>
</html>

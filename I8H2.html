<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzikale Aanwijzing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1em;
        }

        .music-notes {
            font-size: 4em;
            margin: 30px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .play-button-container {
            margin: 40px 0;
        }

        .play-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            color: white;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
            transition: all 0.3s;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.7);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .play-button.playing {
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-text {
            font-size: 1.1em;
            color: #666;
            margin: 20px 0;
            min-height: 30px;
        }

        .hint {
            background: #e7f3ff;
            border: 2px solid #2196F3;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
            color: #0d47a1;
        }

        .hint-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .hint-text {
            font-size: 0.95em;
            line-height: 1.6;
        }

        .back-btn {
            margin-top: 30px;
            background: #666;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #555;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.6em;
            }

            .play-button {
                width: 120px;
                height: 120px;
                font-size: 3em;
            }

            .music-notes {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="play-button-container">
            <button class="play-button" id="playBtn" onclick="playNote()">
                ▶️
            </button>
        </div>

        <div class="status-text" id="status"></div>

        <a href="index.html" class="back-btn">Terug naar Start</a>
    </div>

    <script>
        let audioContext;
        let isPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(frequency, duration, delay = 0) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = frequency;
                    oscillator.type = 'sine';
                    
                    // Envelope for smooth sound
                    const now = audioContext.currentTime;
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + duration / 1000);
                    
                    oscillator.start(now);
                    oscillator.stop(now + duration / 1000);
                    
                    setTimeout(resolve, duration);
                }, delay);
            });
        }

        async function playNote() {
            if (isPlaying) return;
            
            initAudio();
            isPlaying = true;
            
            const btn = document.getElementById('playBtn');
            const status = document.getElementById('status');
            
            btn.classList.add('playing');
            btn.textContent = '🔊';
            status.textContent = 'Bezig met afspelen...';
            
            // Play DO note (C4 = 261.63 Hz)
            await playTone(261.63, 800);
            
            // Short pause
            await new Promise(resolve => setTimeout(resolve, 200));
            
            // Play DO note again (C4 = 261.63 Hz)
            await playTone(261.63, 800);
            
            // Reset button
            btn.classList.remove('playing');
            btn.textContent = '▶️';
            status.textContent = 'Klaar! Druk opnieuw om nog eens te luisteren.';
            isPlaying = false;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            background: white;
            border: 8px solid #c41e3a;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Decorative corners */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
        }

        .corner::before {
            content: '♦';
            font-size: 40px;
            color: #c41e3a;
            position: absolute;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
        }

        .corner-tr::before {
            content: '♠';
            color: #000;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
        }

        .corner-bl::before {
            content: '♥';
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
        }

        .corner-br::before {
            content: '♣';
            color: #000;
        }

        /* Decorative border pattern */
        .card-container::before {
            content: '';
            position: absolute;
            top: 50px;
            left: 50px;
            right: 50px;
            bottom: 50px;
            border: 2px solid rgba(196, 30, 58, 0.2);
            border-radius: 10px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #c41e3a;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .text-section {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border: 3px solid #c41e3a;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 5px 20px rgba(196, 30, 58, 0.2);
            position: relative;
        }

        .text-section:nth-child(3) {
            background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);
            border-color: #000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .text-label {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #c41e3a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-section:nth-child(3) .text-label {
            color: #000;
        }

        .text-content {
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
        }

        .suit-decoration {
            position: absolute;
            font-size: 3em;
            opacity: 0.1;
        }

        .suit-top {
            top: 10px;
            right: 15px;
            color: #c41e3a;
        }

        .suit-bottom {
            bottom: 10px;
            left: 15px;
            color: #c41e3a;
        }

        .text-section:nth-child(3) .suit-top,
        .text-section:nth-child(3) .suit-bottom {
            color: #000;
        }

        .back-btn {
            margin-top: 30px;
            background: #c41e3a;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #a01828;
        }

        @media (max-width: 768px) {
            .card-container {
                padding: 30px 20px;
                border-width: 5px;
            }

            h1 {
                font-size: 1.8em;
            }

            .text-label {
                font-size: 1.4em;
            }

            .text-content {
                font-size: 1em;
            }

            .corner {
                width: 40px;
                height: 40px;
            }

            .corner::before {
                font-size: 30px;
            }

            .corner-tl, .corner-tr {
                top: 10px;
            }

            .corner-tl, .corner-bl {
                left: 10px;
            }

            .corner-tr, .corner-br {
                right: 10px;
            }

            .corner-bl, .corner-br {
                bottom: 10px;
            }

            .card-container::before {
                top: 35px;
                left: 35px;
                right: 35px;
                bottom: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="content">
            <h1>🎴 Raadsel 🎴</h1>

            <div class="text-section">
                <div class="suit-decoration suit-top">♥</div>
                <div class="text-label">Verwarde Dorien</div>
                <div class="suit-decoration suit-bottom">♦</div>
            </div>

            <div class="text-section">
                <div class="suit-decoration suit-top">♠</div>
                <div class="text-label">Boze Ellen</div>
                <div class="suit-decoration suit-bottom">♣</div>
            </div>

            <a href="index.html" class="back-btn">Terug naar Start</a>
        </div>
    </div>
</body>
</html>

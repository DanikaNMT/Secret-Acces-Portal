<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hint Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .puzzle-container {
            background: #f5f5f5;
            padding: 40px 30px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px dashed #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .puzzle-item {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .euro-sign {
            font-size: 5em;
            font-weight: bold;
            color: #667eea;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .product-image {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .product-image:hover {
            transform: scale(1.05);
        }

        .math-text {
            font-size: 3.5em;
            font-weight: bold;
            color: #764ba2;
            font-family: 'Courier New', monospace;
        }

        .hint {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #856404;
        }

        .hint-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .hint-text {
            font-size: 0.95em;
            line-height: 1.6;
        }

        .back-btn {
            margin-top: 20px;
            background: #666;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #555;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .puzzle-container {
                padding: 30px 20px;
                gap: 20px;
            }

            .euro-sign {
                font-size: 3.5em;
            }

            .product-image {
                max-width: 150px;
            }

            .math-text {
                font-size: 2.5em;
            }
        }

        @media (max-width: 480px) {
            .puzzle-container {
                flex-direction: column;
                gap: 15px;
            }

            .euro-sign {
                font-size: 3em;
            }

            .product-image {
                max-width: 180px;
            }

            .math-text {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="puzzle-container">
            <div class="puzzle-item">
                <span class="euro-sign">€</span>
            </div>
            
            <div class="puzzle-item">
                <img src="https://shop.chouffe.com/media/catalog/product/c/h/chouffe_packshots_webshop_2400x1700_CC_40e5.png" 
                     alt="Chouffe" 
                     class="product-image"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/200x200?text=Chouffe';">
            </div>
            
            <div class="puzzle-item">
                <span class="math-text">- 2.34</span>
            </div>
        </div>
        <a href="index.html" class="back-btn">Terug naar Start</a>
    </div>
</body>
</html>
